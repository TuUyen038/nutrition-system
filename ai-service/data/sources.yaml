# Sổ đăng ký tài liệu của kho RAG. MỌI tài liệu trong data/raw/ phải có một mục ở đây.
#
# Quy trình thêm tài liệu (xem README, mục "Quản lý tài liệu nguồn"):
#   1. Tải file gốc từ trang CHÍNH THỨC (who.int, iris.who.int, acsm.org, journals.lww.com/acsm-msse, moh.gov.vn)
#      -> lưu vào data/sources/<id>/source.pdf|html (thư mục này không commit, chỉ commit sha256 ở đây)
#   2. python scripts/source_to_md.py <id>       -> data/drafts/<id>.md (nguyên văn, front matter từ file này)
#   3. Chỉ được thêm/sửa dòng heading (##). Không sửa chữ trong đoạn văn.
#   4. python scripts/check_sources.py <id> --file data/drafts/<id>.md   -> phải PASS
#   5. Chép sang data/raw/, status: checked, rồi ingest.py --only <file>
#   6. Người duyệt mở file gốc, đối chiếu các con số chính -> status: verified, verified_by, verified_at
#
# status: draft (ingest bỏ qua) | checked | verified | legacy (chưa có file gốc) | rejected (ingest bỏ qua)
